apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/devsecops-project.git
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
